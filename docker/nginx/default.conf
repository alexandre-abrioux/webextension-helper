server {

    listen 80 default_server;

    root   /usr/src/app/helper/public;

    # Do not leak nginx version (header + error pages)
    server_tokens off;

    # Requests are GET-only, no body expected
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Prevent MIME sniffing of JSON / xpi responses
    add_header X-Content-Type-Options "nosniff" always;

    # Generic error page: hide that this is an nginx server
    # (no wildcard support: list every code nginx or php-fpm can emit here)
    error_page 400 403 404 405 413 414 494 500 501 502 503 504 /error.html;

    location = /error.html {
        internal;
        root /usr/share/nginx/error;
    }

    location ~ ^/(?:download|update)\.php$ {
        limit_except GET {
            deny all;
        }
        fastcgi_pass   php:9000;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /usr/src/app/helper/public$fastcgi_script_name;
        fastcgi_param  SERVER_SOFTWARE "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors on;
    }

    # Everything else is denied
    location / {
        return 404;
    }

}
